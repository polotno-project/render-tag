name: Test

# CI runs with RENDER_TAG_PORTABLE=1: suites that self-compare against the
# browser's own DOM in the same environment gate at full strictness, while the
# environment-pinned contracts (recorded pixel-score/wrap baselines, the
# cross-browser Chrome reference, fuzz signature sets, system-font geometry)
# stay local-only — they were recorded on the maintainer's machine and font
# rasterization differs per OS/runner image. See CLAUDE.md
# "CI vs local deep testing".

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-latest
            install: --with-deps chromium
            script: test
          - browser: firefox
            os: ubuntu-latest
            install: --with-deps firefox
            script: test:firefox
          # Playwright WebKit is not branded Safari, but running the engine on
          # macOS is the closest automatable full-corpus lane to shipping Safari.
          - browser: webkit
            os: macos-latest
            install: webkit
            script: test:webkit
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache native DOM references
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/render-tag/native-dom
          # A unique key every run: actions/cache only uploads when the key
          # missed, and references added by this run must get written back.
          # What actually invalidates a reference is decided in
          # tests/helpers/native-dom-command.ts, which partitions the cache by
          # an environment digest and prunes the directories it supersedes.
          key: ${{ runner.os }}-native-dom-${{ matrix.browser }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-native-dom-${{ matrix.browser }}-
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install ${{ matrix.install }}
      - run: npm run ${{ matrix.script }}
        env:
          RENDER_TAG_PORTABLE: "1"
      - if: matrix.browser == 'chromium'
        run: npm run build
