name: Test

# CI runs with RENDER_TAG_PORTABLE=1: suites that self-compare against the
# browser's own DOM in the same environment gate at full strictness, while the
# environment-pinned contracts (recorded pixel-score/wrap baselines, the
# cross-browser Chrome reference, fuzz signature sets, system-font geometry)
# stay local-only — they were recorded on the maintainer's machine and font
# rasterization differs per OS/runner image. See CLAUDE.md
# "CI vs local deep testing".

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache native DOM references
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/render-tag/native-dom
          # A unique key every run: actions/cache only uploads when the key
          # missed, and references added by this run must get written back.
          # What actually invalidates a reference is decided in
          # tests/helpers/native-dom-command.ts, which partitions the cache by
          # an environment digest and prunes the directories it supersedes.
          key: ${{ runner.os }}-native-dom-chromium-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-native-dom-chromium-
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          RENDER_TAG_PORTABLE: "1"
      - run: npm run build

  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache native DOM references
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/render-tag/native-dom
          # A unique key every run: actions/cache only uploads when the key
          # missed, and references added by this run must get written back.
          # What actually invalidates a reference is decided in
          # tests/helpers/native-dom-command.ts, which partitions the cache by
          # an environment digest and prunes the directories it supersedes.
          key: ${{ runner.os }}-native-dom-firefox-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-native-dom-firefox-
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: ${{ runner.os }}-playwright-firefox-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps firefox
      - run: npm run test:firefox
        env:
          RENDER_TAG_PORTABLE: "1"

  webkit:
    # Playwright WebKit is not branded Safari, but running the engine on macOS
    # is the closest automatable full-corpus lane to shipping Safari.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache native DOM references
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/render-tag/native-dom
          # A unique key every run: actions/cache only uploads when the key
          # missed, and references added by this run must get written back.
          # What actually invalidates a reference is decided in
          # tests/helpers/native-dom-command.ts, which partitions the cache by
          # an environment digest and prunes the directories it supersedes.
          key: ${{ runner.os }}-native-dom-webkit-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-native-dom-webkit-
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: ${{ runner.os }}-playwright-webkit-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install webkit
      - run: npm run test:webkit
        env:
          RENDER_TAG_PORTABLE: "1"
