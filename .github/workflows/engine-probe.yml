name: Engine probe

# Report-only measurement (tests/engine-probe.test.ts): each engine's DOM
# numbers beside render-tag's prediction, uploaded as JSON for fitting engine
# rules, chiefly Gecko on the ubuntu runner (its system fonts differ from the Mac).
# Never gates anything. See the header of tests/engine-probe.test.ts.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx vitest run --project ${{ matrix.browser }} tests/engine-probe.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-probe-${{ matrix.browser }}
          path: tests/.out/engine-probe.*.json
          # tests/.out is a dot-folder, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: error
